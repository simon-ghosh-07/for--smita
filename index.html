<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Smita (Sona) 🌸</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    color: white;
    box-shadow: 0 0 30px rgba(0,0,0,0.2);
    width: 90%;
    max-width: 600px;
}

h1 {
    font-size: 2.3em;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px white; }
    to { text-shadow: 0 0 25px #ff004c; }
}

#message {
    margin-top: 20px;
    font-size: 1.1em;
    min-height: 180px;
    line-height: 1.7;
}

button {
    margin-top: 25px;
    padding: 10px 25px;
    border-radius: 25px;
    border: none;
    cursor: pointer;
    font-size: 1em;
    background: white;
    color: #ff4e8a;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
    background: #ff4e8a;
    color: white;
}

.heart {
    position: absolute;
    animation: float 6s linear infinite;
}

@keyframes float {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10vh); }
}
</style>
</head>

<body>

<audio id="bgMusic" autoplay loop muted>
  <source src="romantic.mp3" type="audio/mpeg">
</audio>

<div class="card">
    <h1>Smita (Sona) 🌸</h1>
    <div id="message"></div>
    <button onclick="unlock()">A Little More 💌</button>
</div>

<script>

const text = `I don't know when it started,
but somewhere between normal conversations,
you became someone very special to me.

You have one of the kindest hearts I’ve ever seen.
The way you talk, the way you care —
it feels different.

And honestly,
I have never seen anyone more beautiful than you.

Your long hair?
There are no words for it.

That small, cute face of yours —
it has this magic.
Every time I see you,
my heartbeat goes a little faster.

Your voice is so sweet,
even sugar would lose in front of it.
And your cuteness?
There is absolutely no comparison.

Maybe I don’t say these things directly.
Maybe I act normal.

But the truth is,
you are my favourite girl.
And no one comes close. 🌸`;

let i = 0;

function typeWriter() {
    if (i < text.length) {
        document.getElementById("message").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 35);
    }
}
typeWriter();

function unlock() {
    alert("I just genuinely admire you more than you know. 💗");
}

window.addEventListener('click', function() {
    document.getElementById('bgMusic').play();
});

// Floating hearts
setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 20 + "px";
    document.body.appendChild(heart);
    setTimeout(() => { heart.remove(); }, 6000);
}, 500);

</script>

</body>
</html>
