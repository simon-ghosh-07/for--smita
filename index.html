<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Debosmita 🌸</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    color: white;
    box-shadow: 0 0 30px rgba(0,0,0,0.2);
    width: 90%;
    max-width: 550px;
}

h1 {
    font-size: 2.3em;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px white; }
    to { text-shadow: 0 0 25px #ff004c; }
}

#message {
    margin-top: 20px;
    font-size: 1.2em;
    min-height: 120px;
    line-height: 1.6;
}

button {
    margin-top: 25px;
    padding: 10px 25px;
    border-radius: 25px;
    border: none;
    cursor: pointer;
    font-size: 1em;
    background: white;
    color: #ff4e8a;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
    background: #ff4e8a;
    color: white;
}

.heart {
    position: absolute;
    animation: float 6s linear infinite;
}

@keyframes float {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10vh); }
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
  <source src="romantic.mp3" type="audio/mpeg">
</audio>

<div class="card">
    <h1>Debosmita 🌸</h1>
    <div id="message"></div>
    <button onclick="unlock()">Click Here 💌</button>
</div>

<script>

const text = `There was once a boy who never really believed in "favourite person" concept.
Until one day, a girl named Debosmita slowly became part of his everyday routine.

Her random talks, her little complaints about gorom cha ☕,
her simple "ki korchis?" messages —
somehow started becoming the best part of his day.

He never says big dramatic words.
But if someone ever asked him,
"Who is your favourite girl?"

He would smile quietly and think of her.

And maybe... just maybe,
she already knows. 🌸

– Simone`;

let i = 0;

function typeWriter() {
    if (i < text.length) {
        document.getElementById("message").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 35);
    }
}
typeWriter();

function unlock() {
    alert("Just wanted you to know... you are really special to me. Always have been. 🌷");
}

window.addEventListener('click', function() {
    document.getElementById('bgMusic').play();
});

// Floating hearts
setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 20 + "px";
    document.body.appendChild(heart);
    setTimeout(() => { heart.remove(); }, 6000);
}, 500);

</script>

</body>
</html>
